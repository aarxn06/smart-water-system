apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-water
  labels:
    app: smart-water
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-water
  template:
    metadata:
      labels:
        app: smart-water
    spec:
      containers:
        - name: dashboard
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smart-water-service
spec:
  type: NodePort
  selector:
    app: smart-water
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
